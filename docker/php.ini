; Production PHP settings. Anything that would leak internals to a client is off.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

memory_limit = 256M
max_execution_time = 60

; The CV upload is capped at 5 MB by validation; these leave headroom for the
; multipart envelope without allowing a much larger body.
upload_max_filesize = 10M
post_max_size = 12M

; Opcache is the single biggest win for a PHP app in a container. validate_
; timestamps is off because the code never changes inside a running image: a
; deploy replaces the container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

date.timezone = UTC
